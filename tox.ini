[tox]
envlist = py38, py39, py310, py311, py312, py313, flake8

[testenv:flake8]
basepython = python
deps = -r{toxinidir}/requirements/flake8.txt
commands = flake8 xero_python tests

[testenv]
setenv = PYTHONPATH = {toxinidir}
deps = -r{toxinidir}/requirements/test.txt
commands = pytest --vcr-record=none --basetemp={envtmpdir} xero_python tests

