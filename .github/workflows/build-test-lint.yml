name: Python Build, Lint and Test

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the support range declared in setup.py and the tox envlist.
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out event source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements/dev.txt
          python -m pip check

      - name: Lint
        run: python -m flake8 xero_python tests

      - name: Audit runtime dependencies
        # pip-audit requires Python 3.10+, and auditing requirements.txt does
        # not vary by interpreter, so run it once on the newest leg.
        if: matrix.python == '3.13'
        run: python -m pip_audit -r requirements.txt

      - name: Build package
        if: matrix.python == '3.13'
        run: python -m build

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18

      - name: Install Prism
        run: npm install --global @stoplight/prism-cli@5.16.0

      - name: Start Prism
        env:
          XERO_OPENAPI_REF: ee65f8bddb16f37cde3e32741d465eeed6507a74
        run: |
          bash tests/utils/start-prism.sh "$XERO_OPENAPI_REF"
          python - <<'PY'
          import socket
          import time

          def listening(port):
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=1):
                      return True
              except OSError:
                  return False

          ports = range(4010, 4019)
          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              if all(listening(port) for port in ports):
                  break
              time.sleep(1)
          else:
              raise SystemExit("Prism did not open ports 4010-4018 within 60 seconds")
          PY

      - name: Test
        run: python -m pytest -v

      - name: Stop Prism
        if: always()
        run: pkill -f "[p]rism mock" || true
